name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history is scanned for newly introduced credentials.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Verify public-data guard and publishable files
        run: |
          npm run test:public
          npm run check:public
          gitleaks git . --config .gitleaks.toml --log-opts=--all --redact --no-banner

      - name: Run isolated synthetic lifecycle demo
        run: npm run demo:synthetic

      - name: Run repository verification
        run: npm run verify

      - name: Verify interactive demo
        run: |
          npm ci --prefix demo
          npm --prefix demo run typecheck
          npm --prefix demo test

      - name: Verify offline Platform Watch pilot materials
        run: node --test experiments/platform-watch/pilot.test.mjs

      - name: Package pinned Workspace Skills
        run: npm run skills:package -- --source-ref "$GITHUB_SHA"

      - name: Upload Workspace Skill release
        uses: actions/upload-artifact@v6
        with:
          name: workspace-skills-${{ github.sha }}
          path: dist/workspace-skills/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build and verify public architecture site
        run: |
          node --test scripts/build-showcase.test.mjs
          npm run build:showcase

      - name: Upload architecture site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/showcase

  pages:
    name: Publish architecture showcase
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy architecture site
        id: deployment
        uses: actions/deploy-pages@v4
