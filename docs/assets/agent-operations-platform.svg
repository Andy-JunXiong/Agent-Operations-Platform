<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">Agent Operations Platform — from agent reasoning to durable operations</title>
  <desc id="description">A conceptual flow from an AI host proposing an action, through platform controls and explicit authority, to durable state, tasks and receipts. A return path supplies saved context to the next interaction.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#030c17"/><stop offset="1" stop-color="#0b1e23"/></linearGradient>
    <radialGradient id="ambient"><stop stop-color="#29604b" stop-opacity=".28"/><stop offset="1" stop-color="#082329" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#12292c"/><stop offset="1" stop-color="#0b1823"/></linearGradient>
    <linearGradient id="signal"><stop stop-color="#83e2c2" stop-opacity=".25"/><stop offset="1" stop-color="#b7e29d"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#375d61" opacity=".26"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="m0 0 6 3.5-6 3.5" fill="none" stroke="#8bc8a4" stroke-width="1"/></marker>
  </defs>
  <rect width="1600" height="720" fill="url(#background)"/>
  <rect x="690" width="910" height="720" fill="url(#dots)"/>
  <ellipse cx="1160" cy="420" rx="510" ry="420" fill="url(#ambient)"/>
  <path d="M752 720 1080 430H1600M848 720 1160 430M974 720 1240 430M1120 720 1320 430M1295 720 1400 430M1490 720 1480 430M815 664H1600M867 614H1600M924 562H1600M980 511H1600" fill="none" stroke="#366063" stroke-width="1" opacity=".15"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="82" cy="91" r="4" fill="#a4d894"/>
    <text x="99" y="98" font-size="16" letter-spacing="3.4" fill="#96b8b0">SYSTEMS FOR AI-ASSISTED WORK</text>
    <g font-family="Impact, 'Arial Narrow', sans-serif" font-weight="800" font-size="104" letter-spacing="1" fill="#f0ecd9">
      <text x="76" y="259">AGENT</text>
      <text x="76" y="367">OPERATIONS</text>
      <text x="76" y="475" fill="#b2d99a">PLATFORM</text>
    </g>
    <text x="80" y="536" font-size="26" fill="#c4d0c9">From agent reasoning to durable operations</text>
    <path d="M80 584H610" stroke="#314b47"/>
    <text x="80" y="620" font-size="15" letter-spacing="1.8" fill="#7c9f96">EVIDENCE</text>
    <circle cx="211" cy="614" r="2" fill="#62867c"/>
    <text x="231" y="620" font-size="15" letter-spacing="1.8" fill="#7c9f96">AUTHORITY</text>
    <circle cx="379" cy="614" r="2" fill="#62867c"/>
    <text x="399" y="620" font-size="15" letter-spacing="1.8" fill="#7c9f96">DURABLE STATE</text>
    <text x="817" y="104" font-size="13" letter-spacing="2.8" fill="#6d958c">REASON → GOVERN → REMEMBER</text>
    <!-- Illustrated responsibilities, not a separate kernel service. -->
    <path d="M945 238V290H1120V331M1120 429V461H1320V486" fill="none" stroke="#84d3af" stroke-width="6" opacity=".15" filter="url(#glow)"/>
    <path d="M945 238V290H1120V327M1120 429V461H1320V482" fill="none" stroke="url(#signal)" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1448 607H1502V168H1085" fill="none" stroke="#3e7274" stroke-width="1.5" stroke-dasharray="5 7"/>
    <path d="M1093 164 1085 168 1093 172" fill="none" stroke="#629b91" stroke-width="1.5"/>
    <text x="1457" y="353" font-size="11" letter-spacing="1.7" fill="#5c8885" transform="rotate(-90 1457 353)">SAVED CONTEXT FOR THE NEXT INTERACTION</text>
    <rect x="817" y="139" width="268" height="100" rx="10" fill="url(#panel)" stroke="#42796e"/>
    <circle cx="852" cy="174" r="9" fill="none" stroke="#9cd3ba" stroke-width="1.5"/>
    <path d="M852 160V165M852 183V188M838 174H843M861 174H866" stroke="#9cd3ba" stroke-width="1.5"/>
    <text x="878" y="179" font-size="19" letter-spacing="1.4" fill="#e0e9d9">AI HOST</text>
    <text x="842" y="214" font-size="14" fill="#87aaa0">Interpret evidence. Propose an action.</text>
    <text x="964" y="270" font-size="12" fill="#84aa99">proposal</text>
    <circle cx="1120" cy="290" r="4" fill="#b2d99a"/>
    <rect x="1178" y="264" width="210" height="36" rx="18" fill="#212d27" stroke="#797a4d"/>
    <circle cx="1198" cy="282" r="4" fill="#d7c381"/>
    <text x="1210" y="287" font-size="11" letter-spacing="1" fill="#d8cb98">EXPLICIT AUTHORITY</text>
    <path d="M1267 300V315H1210V331" fill="none" stroke="#b7ab72" stroke-width="1.2" stroke-dasharray="3 4"/>
    <rect x="962" y="334" width="334" height="97" rx="10" fill="url(#panel)" stroke="#72975e"/>
    <path d="m991 355 12 7v14l-12 7-12-7v-14z" fill="none" stroke="#b2d99a" stroke-width="1.5"/>
    <path d="m985 369 4 4 8-9" fill="none" stroke="#b2d99a" stroke-width="1.5"/>
    <text x="1018" y="373" font-size="18" letter-spacing="1" fill="#dfe9d8">PLATFORM CONTROLS</text>
    <text x="984" y="407" font-size="13" fill="#8ea88c">Identity · evidence · rules · admission</text>
    <text x="1138" y="453" font-size="12" fill="#84aa99">accepted command</text>
    <circle cx="1320" cy="461" r="4" fill="#b2d99a"/>
    <rect x="1134" y="488" width="314" height="162" rx="10" fill="url(#panel)" stroke="#40797b"/>
    <path d="M1158 510h22v19h-22zM1158 516h22M1158 522h22" fill="none" stroke="#89c8c2" stroke-width="1.4"/>
    <text x="1193" y="526" font-size="18" letter-spacing="1.2" fill="#e0e9d9">DURABLE STATE</text>
    <path d="M1158 544H1424" stroke="#294a4c"/>
    <g font-size="13" fill="#91b1aa"><text x="1159" y="569">Business state</text><text x="1159" y="596">Derived tasks</text><text x="1159" y="623">Execution receipts</text></g>
    <g fill="none" stroke="#94c29a" stroke-width="1.5"><path d="m1406 561 4 4 7-8M1406 588l4 4 7-8M1406 615l4 4 7-8"/></g>
  </g>
</svg>
